main{max-width:1100px;margin:auto;padding:16px 14px 100px}

.def{background:var(--accent-soft);border-left:4px solid var(--accent);padding:10px 12px;border-radius:8px;margin:8px 0}

  .card,.q,.acc-item{box-shadow:none;border-color:#999;break-inside:avoid}
  .acc-body{display:block!important}
  .tablewrap{max-height:none;overflow:visible}

</style>

function touchStreak(){const d=today();if(S.lastDay===d)return;const y=new Date(Date.now()-864e5).toISOString().slice(0,10);S.streak=S.lastDay===y?S.streak+1:1;S.lastDay=d;save()}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* ================= SPEECH ================= */

function speak(text,r){if(!("speechSynthesis" in window)){toast("Speech not supported on this browser");return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="en-IN";u.rate=r||rate;speechSynthesis.speak(u)}
const sayBtn=t=>`<button class="say" onclick="speak('${esc(t).replace(/'/g,"\\'")}')" aria-label="Listen to ${esc(t)}">🔊 Listen</button>`;

const L=[
{id:"what",t:"What is a Verb?",kt:"ಕ್ರಿಯಾಪದ ಎಂದರೇನು?",d:"A verb is a word that shows an action, state, or occurrence.",kd:"ಕ್ರಿಯೆಯನ್ನು, ಸ್ಥಿತಿಯನ್ನು ಅಥವಾ ಸಂಭವವನ್ನು ಸೂಚಿಸುವ ಪದವನ್ನು ಕ್ರಿಯಾಪದ ಎನ್ನುತ್ತೇವೆ.",ex:["Ravi <b>runs</b> fast. (action)","She <b>is</b> happy. (state)","It <b>happened</b> yesterday. (occurrence)"],tip:"Ask: What does the subject DO or what IS the subject? The answer is the verb.",ktip:"ಕರ್ತೃ ಏನು ಮಾಡುತ್ತದೆ ಅಥವಾ ಹೇಗಿದೆ ಎಂದು ಕೇಳಿ – ಉತ್ತರವೇ ಕ್ರಿಯಾಪದ."},
{id:"identify",t:"Identifying Verbs",kt:"ಕ್ರಿಯಾಪದ ಗುರುತಿಸುವುದು",d:"Every complete sentence has at least one verb. Find the word that changes with tense (play → played).",kd:"ಪ್ರತಿ ಪೂರ್ಣ ವಾಕ್ಯದಲ್ಲಿ ಕನಿಷ್ಠ ಒಂದು ಕ್ರಿಯಾಪದ ಇರುತ್ತದೆ. ಕಾಲಕ್ಕೆ ತಕ್ಕಂತೆ ಬದಲಾಗುವ ಪದವೇ ಕ್ರಿಯಾಪದ.",ex:["The baby <b>sleeps</b>.","They <b>have finished</b> the work.","Birds <b>can fly</b>."],tip:"Change the time: 'today / yesterday'. The word that changes is the verb."},
{id:"main",t:"Main Verbs",kt:"ಮುಖ್ಯ ಕ್ರಿಯಾಪದ",d:"A main (principal) verb carries the main meaning of the sentence.",kd:"ವಾಕ್ಯದ ಮುಖ್ಯ ಅರ್ಥವನ್ನು ಕೊಡುವ ಕ್ರಿಯಾಪದವೇ ಮುಖ್ಯ ಕ್ರಿಯಾಪದ.",ex:["She <b>writes</b> letters.","He is <b>reading</b> a book.","We have <b>eaten</b>."],tip:"In 'is reading', reading is the main verb; is is helping."},
{id:"helping",t:"Helping / Auxiliary Verbs",kt:"ಸಹಾಯಕ ಕ್ರಿಯಾಪದ",d:"Helping verbs help the main verb show tense, voice, mood or question. Primary auxiliaries: be (am, is, are, was, were, be, been, being), have (have, has, had), do (do, does, did).",kd:"ಮುಖ್ಯ ಕ್ರಿಯಾಪದಕ್ಕೆ ಕಾಲ, ಪ್ರಶ್ನೆ, ನಿಷೇಧ ತೋರಿಸಲು ಸಹಾಯ ಮಾಡುವ ಪದಗಳು: be, have, do ರೂಪಗಳು.",ex:["I <b>am</b> learning.","She <b>has</b> gone.","<b>Do</b> you like tea?","The work <b>was</b> done."],tip:"Be, have and do can also be main verbs: 'I have a pen.'"},
{id:"modal",t:"Modal Verbs",kt:"ಮೋಡಲ್ ಕ್ರಿಯಾಪದ",d:"Modals show ability, permission, possibility, obligation, advice or request: can, could, may, might, shall, should, will, would, must, ought to, need, dare, used to.",kd:"ಸಾಮರ್ಥ್ಯ, ಅನುಮತಿ, ಸಾಧ್ಯತೆ, ಕರ್ತವ್ಯ, ಸಲಹೆ ತೋರಿಸುವ ಸಹಾಯಕ ಪದಗಳು: can, may, must, should ಇತ್ಯಾದಿ.",ex:["I <b>can</b> swim. (ability)","<b>May</b> I come in? (permission)","You <b>should</b> rest. (advice)","We <b>must</b> obey rules. (obligation)","It <b>might</b> rain. (possibility)"],tip:"Rules: modal + base verb (can go, not can goes / can to go); no -s (he can); negative = modal + not; question = modal + subject.",ktip:"ನಿಯಮ: ಮೋಡಲ್ + ಮೂಲ ಕ್ರಿಯಾಪದ. 's' ಸೇರಿಸಬೇಡಿ. 'to' ಬಳಸಬೇಡಿ."},
{id:"forms",t:"Verb Forms (V1–V5)",kt:"ಕ್ರಿಯಾಪದ ರೂಪಗಳು",d:"V1 base (go), V2 past (went), V3 past participle (gone), V4 present participle -ing (going), V5 -s/-es form (goes).",kd:"V1 ಮೂಲ, V2 ಭೂತಕಾಲ, V3 ಭೂತ ಕೃದಂತ, V4 -ing ರೂಪ, V5 -s/-es ರೂಪ.",ex:["V1: I <b>write</b>.","V2: I <b>wrote</b>.","V3: I have <b>written</b>.","V4: I am <b>writing</b>.","V5: He <b>writes</b>."],tip:"Use V3 after have/has/had and in passive voice."},
{id:"regular",t:"Regular Verbs",kt:"ನಿಯಮಿತ ಕ್ರಿಯಾಪದ",d:"Regular verbs form V2 and V3 by adding -d / -ed: play-played, live-lived, study-studied, stop-stopped.",kd:"-d / -ed ಸೇರಿಸಿ ಭೂತಕಾಲ ರೂಪ ಮಾಡುವ ಕ್ರಿಯಾಪದಗಳು ನಿಯಮಿತ ಕ್ರಿಯಾಪದಗಳು.",ex:["consonant + y → ied: cry → cried","short vowel + consonant → double: stop → stopped","e ending → add d: dance → danced"],tip:"-ed sounds: /t/ walked, /d/ played, /ɪd/ wanted."},
{id:"irregular",t:"Irregular Verbs",kt:"ಅನಿಯಮಿತ ಕ್ರಿಯಾಪದ",d:"Irregular verbs do not follow the -ed rule. Patterns: A-A-A (cut-cut-cut), A-B-B (buy-bought-bought), A-B-A (come-came-come), A-B-C (go-went-gone).",kd:"-ed ನಿಯಮ ಪಾಲಿಸದ ಕ್ರಿಯಾಪದಗಳು. ಇವುಗಳನ್ನು ನೆನಪಿಟ್ಟುಕೊಳ್ಳಬೇಕು.",ex:["A-A-A: put put put","A-B-B: teach taught taught","A-B-A: run ran run","A-B-C: write wrote written"],tip:"Learn irregular verbs in pattern groups, not alphabetically."},
{id:"tense",t:"Tense + Verb Connection",kt:"ಕಾಲ ಮತ್ತು ಕ್ರಿಯಾಪದ",d:"Simple: V1/V5, V2, will+V1. Continuous: be + V4. Perfect: have/has/had + V3. Perfect continuous: have/has/had been + V4.",kd:"ಸರಳ ಕಾಲ: V1/V2; ನಿರಂತರ: be+ing; ಪೂರ್ಣ: have+V3; ಪೂರ್ಣ ನಿರಂತರ: have been+ing.",ex:["Present simple: She <b>plays</b>.","Past continuous: She <b>was playing</b>.","Present perfect: She <b>has played</b>.","Future perfect continuous: She <b>will have been playing</b>."],tip:"Use the Tense Builder tool to build all 12 tenses for any verb."},
{id:"trans",t:"Transitive & Intransitive Verbs",kt:"ಸಕರ್ಮಕ ಮತ್ತು ಅಕರ್ಮಕ",d:"A transitive verb needs an object (She <b>reads</b> a book). An intransitive verb has no object (The baby <b>sleeps</b>).",kd:"ಕರ್ಮ ಬೇಕಾದ ಕ್ರಿಯಾಪದ ಸಕರ್ಮಕ; ಕರ್ಮ ಬೇಡದ ಕ್ರಿಯಾಪದ ಅಕರ್ಮಕ.",ex:["He kicked <b>the ball</b>. (transitive)","She laughed. (intransitive)","He runs daily. / He runs a shop. (both)"],tip:"Ask 'What?' or 'Whom?' after the verb. If there is an answer, it is transitive. Only transitive verbs have passive voice."},
{id:"linking",t:"Linking Verbs",kt:"ಸಂಪರ್ಕ ಕ್ರಿಯಾಪದ",d:"Linking verbs connect the subject to a word that describes it: be, become, seem, appear, look, feel, taste, smell, sound, grow, remain.",kd:"ಕರ್ತೃವನ್ನು ಅದನ್ನು ವರ್ಣಿಸುವ ಪದಕ್ಕೆ ಜೋಡಿಸುವ ಕ್ರಿಯಾಪದಗಳು.",ex:["She <b>seems</b> tired.","The soup <b>tastes</b> good.","He <b>became</b> a doctor."],tip:"Use adjectives (not adverbs) after linking verbs: 'looks good', not 'looks well' (for appearance)."},
{id:"stative",t:"Action, Stative & Dynamic Verbs",kt:"ಕ್ರಿಯಾ ಮತ್ತು ಸ್ಥಿತಿ ಕ್ರಿಯಾಪದ",d:"Action/dynamic verbs show activity (run, write). Stative verbs show states, feelings, thoughts, possession (know, like, love, believe, own, understand) and are usually not used in continuous tenses.",kd:"ಸ್ಥಿತಿ ಕ್ರಿಯಾಪದಗಳನ್ನು (know, like, believe) ಸಾಮಾನ್ಯವಾಗಿ -ing ರೂಪದಲ್ಲಿ ಬಳಸುವುದಿಲ್ಲ.",ex:["✓ I <b>know</b> him. ✗ I am knowing him.","✓ She <b>likes</b> mangoes.","I <b>am thinking</b> about it. (action meaning – allowed)"],tip:"Some verbs (think, have, see, taste) can be stative or dynamic depending on meaning."},
{id:"finite",t:"Finite & Non-finite Verbs",kt:"ಸಮಾಪಕ ಮತ್ತು ಅಸಮಾಪಕ",d:"Finite verbs change with subject and tense (He goes / They went). Non-finite verbs do not: infinitive (to go), gerund (going), participle (going/gone).",kd:"ಕರ್ತೃ ಮತ್ತು ಕಾಲಕ್ಕೆ ತಕ್ಕಂತೆ ಬದಲಾಗುವುದು ಸಮಾಪಕ; ಬದಲಾಗದವು ಅಸಮಾಪಕ.",ex:["He <b>wants</b> to <u>eat</u>. (wants = finite; to eat = non-finite)","<u>Swimming</u> is good exercise."],tip:"A sentence must contain at least one finite verb."},
{id:"gerund",t:"Gerund",kt:"ಕ್ರಿಯಾನಾಮ (Gerund)",d:"A gerund is the -ing form of a verb used as a noun.",kd:"ನಾಮಪದದಂತೆ ಬಳಸುವ -ing ರೂಪವೇ Gerund.",ex:["<b>Reading</b> is my hobby. (subject)","I enjoy <b>singing</b>. (object)","He is fond of <b>painting</b>. (after preposition)"],tip:"Verbs followed by gerund: enjoy, avoid, finish, mind, suggest, keep, practise, deny, admit, consider. Always use a gerund after a preposition."},
{id:"infinitive",t:"Infinitive",kt:"ಸಾಮಾನ್ಯ ರೂಪ (Infinitive)",d:"An infinitive is 'to + base verb' (to go). A bare infinitive has no 'to' (after modals, make, let, help).",kd:"'to + ಮೂಲ ಕ್ರಿಯಾಪದ' ರೂಪವೇ infinitive.",ex:["I want <b>to learn</b>.","She decided <b>to leave</b>.","Let him <b>go</b>. (bare infinitive)"],tip:"Verbs + infinitive: want, decide, hope, plan, agree, refuse, promise, learn, expect."},
{id:"participle",t:"Participles",kt:"ಕೃದಂತ",d:"Present participle (-ing) is active/ongoing; past participle (V3) is passive/completed. Perfect participle: having + V3.",kd:"-ing ಕೃದಂತ – ನಡೆಯುತ್ತಿರುವ; V3 ಕೃದಂತ – ಮುಗಿದ/ಕರ್ಮಣಿ.",ex:["a <b>running</b> tap","a <b>broken</b> chair","<b>Having finished</b> the work, he left."],tip:"boring (causes feeling) vs bored (has feeling)."},
{id:"phrasal",t:"Phrasal Verbs",kt:"ನುಡಿಗಟ್ಟು ಕ್ರಿಯಾಪದ",d:"Verb + particle (adverb/preposition) with a new meaning.",kd:"ಕ್ರಿಯಾಪದ + ಉಪಸರ್ಗದಿಂದ ಹೊಸ ಅರ್ಥ ಬರುವ ಪದಗುಚ್ಛ.",ex:["give up – stop trying","look after – take care of","put off – postpone","carry on – continue","turn down – reject","look forward to – wait eagerly","call off – cancel","run out of – have no more"],tip:"'Look forward to' is followed by -ing: I look forward to meeting you."},
{id:"causative",t:"Causative Verbs",kt:"ಪ್ರೇರಣಾರ್ಥಕ ಕ್ರಿಯಾಪದ",d:"Causatives show that someone causes another to do something: have/get/make/let/help.",kd:"ಇನ್ನೊಬ್ಬರಿಂದ ಕೆಲಸ ಮಾಡಿಸುವುದನ್ನು ತೋರಿಸುವ ಕ್ರಿಯಾಪದಗಳು.",ex:["I <b>had</b> my car repaired. (have + object + V3)","She <b>got</b> him to sign. (get + object + to V1)","He <b>made</b> me laugh. (make + object + V1)","<b>Let</b> them play."],tip:"make/let + bare infinitive; get + to-infinitive."},
{id:"sva",t:"Subject-Verb Agreement",kt:"ಕರ್ತೃ-ಕ್ರಿಯಾಪದ ಹೊಂದಾಣಿಕೆ",d:"A singular subject takes a singular verb; a plural subject takes a plural verb.",kd:"ಏಕವಚನ ಕರ್ತೃವಿಗೆ ಏಕವಚನ ಕ್ರಿಯಾಪದ, ಬಹುವಚನಕ್ಕೆ ಬಹುವಚನ.",ex:["He <b>plays</b>. They <b>play</b>.","Each of the boys <b>is</b> present.","Neither Ram nor his friends <b>are</b> here. (verb agrees with nearer subject)","The teacher, with her students, <b>is</b> coming.","Bread and butter <b>is</b> my breakfast."],tip:"Ignore phrases like 'with', 'as well as', 'along with' – the verb agrees with the first subject."},
{id:"voice",t:"Active & Passive Voice",kt:"ಕರ್ತರಿ ಮತ್ತು ಕರ್ಮಣಿ ಪ್ರಯೋಗ",d:"Passive = object becomes subject + be (in the same tense) + V3 + (by agent).",kd:"ಕರ್ಮಣಿ: ಕರ್ಮ ಕರ್ತೃವಾಗುತ್ತದೆ + be + V3 + by.",ex:["Active: Ravi writes a letter. → Passive: A letter <b>is written</b> by Ravi.","She is cooking food. → Food <b>is being cooked</b>.","They have built a house. → A house <b>has been built</b>.","He will help me. → I <b>will be helped</b>."],tip:"Intransitive verbs cannot be changed to passive."},
{id:"speech",t:"Reported Speech – Verb Changes",kt:"ಪರೋಕ್ಷ ಕಥನ",d:"When the reporting verb is past, tenses move one step back: is→was, does→did, did→had done, will→would, can→could, may→might.",kd:"ಹೇಳಿಕೆ ಕ್ರಿಯಾಪದ ಭೂತಕಾಲದಲ್ಲಿದ್ದರೆ ಕಾಲ ಒಂದು ಹೆಜ್ಜೆ ಹಿಂದಕ್ಕೆ ಹೋಗುತ್ತದೆ.",ex:["He said, \"I am busy.\" → He said that he <b>was</b> busy.","She said, \"I will come.\" → She said that she <b>would</b> come.","Universal truth – no change: He said that the sun <b>rises</b> in the east."],tip:"No change if the reporting verb is in present tense."},
{id:"cond",t:"Conditionals",kt:"ಷರತ್ತು ವಾಕ್ಯಗಳು",d:"Zero: If + present, present. First: If + present, will + V1. Second: If + past, would + V1. Third: If + had + V3, would have + V3.",kd:"If ವಾಕ್ಯಗಳ ನಾಲ್ಕು ವಿಧಗಳು ಮತ್ತು ಅವುಗಳ ಕ್ರಿಯಾಪದ ರೂಪಗಳು.",ex:["If you heat ice, it <b>melts</b>.","If it rains, we <b>will stay</b> home.","If I <b>were</b> rich, I <b>would travel</b>.","If he <b>had studied</b>, he <b>would have passed</b>."],tip:"Use 'were' for all subjects in imaginary conditions: If I were you…"},
{id:"subj",t:"Subjunctive & Special Structures",kt:"ವಿಶೇಷ ರಚನೆಗಳು",d:"Wish/If only + past (present wish), had + V3 (past regret). It is time + past. Would rather + past. Suggest/insist that + base verb.",kd:"wish, it is time, would rather ಮುಂತಾದ ರಚನೆಗಳಲ್ಲಿ ವಿಶೇಷ ಕ್ರಿಯಾಪದ ರೂಪ.",ex:["I wish I <b>knew</b> the answer.","It is high time we <b>left</b>.","I'd rather you <b>stayed</b>.","He suggested that she <b>see</b> a doctor."],tip:"Common in bank, SSC and other competitive exams."},
{id:"errors",t:"Common Verb Errors",kt:"ಸಾಮಾನ್ಯ ತಪ್ಪುಗಳು",d:"Learn the most frequent mistakes learners make.",kd:"ವಿದ್ಯಾರ್ಥಿಗಳು ಮಾಡುವ ಸಾಮಾನ್ಯ ತಪ್ಪುಗಳು.",ex:["✗ He don't know. → ✓ He doesn't know.","✗ She can sings. → ✓ She can sing.","✗ I am knowing. → ✓ I know.","✗ Did you went? → ✓ Did you go?","✗ He has came. → ✓ He has come.","✗ I am living here since 2010. → ✓ I have been living here since 2010.","✗ One of my friends are… → ✓ One of my friends is…"],tip:"After did/does/do always use V1."},
{id:"pairs",t:"Confusing Verb Pairs",kt:"ಗೊಂದಲದ ಜೋಡಿಗಳು",d:"Pairs that learners often mix up.",kd:"ಹೆಚ್ಚಾಗಿ ಗೊಂದಲವಾಗುವ ಕ್ರಿಯಾಪದ ಜೋಡಿಗಳು.",ex:["lie (rest) – lay (put): I lie down. / Lay the book.","rise (go up, no object) – raise (lift something)","sit – set","borrow (take) – lend (give)","say (words) – tell (someone)","affect (verb) – effect (noun)","accept – except"],tip:"raise, lay, set need an object; rise, lie, sit do not."}
];
const TERMS=["Verb","Main Verb","Helping Verb","Auxiliary Verb","Modal Verb","Transitive Verb","Intransitive Verb","Finite Verb","Non-finite Verb","Infinitive","Gerund","Participle","Regular Verb","Irregular Verb","Phrasal Verb","Linking Verb","Causative Verb","Stative Verb"];

const Q=[];let qid=0;
function addQ(o){o.id="q"+(qid++);Q.push(o)}
function distract(v,key,n=3){const pool=shuffle(VB.filter(x=>x!==v).map(x=>x[key]));const set=new Set();if(key==="p"){set.add(v.pp);set.add(v.ing);set.add(v.b+"ed")}if(key==="pp"){set.add(v.p);set.add(v.ing);set.add(v.b+"ed")}set.delete(v[key]);const arr=[...set].filter(x=>x!==v[key]&&!(v[key].split("/").includes(x)));while(arr.length<n)arr.push(pool.pop());return arr.slice(0,n)}
// 1. V2 / V3 forms
VB.forEach(v=>{
  if(v.b!=="be"&&v.p!==v.b)addQ({topic:"Verb Forms",diff:v.reg?"Beginner":"Intermediate",q:`What is the past tense (V2) of "${v.b}"?`,a:v.p,o:distract(v,"p"),e:`${v.b} – ${v.p} – ${v.pp}. ${v.reg?"Regular verb: add -ed/-d.":"Irregular verb: learn by heart."}`,ke:`"${v.b}" (${v.kn}) ಇದರ ಭೂತಕಾಲ ರೂಪ "${v.p}".`});
  if(v.pp!==v.p||!v.reg)addQ({topic:"Verb Forms",diff:v.reg?"Beginner":"Intermediate",q:`Choose the past participle (V3) of "${v.b}".`,a:v.pp,o:distract(v,"pp"),e:`V3 of ${v.b} is ${v.pp}. Used after have/has/had and in passive voice.`,ke:`"${v.b}" ಇದರ V3 ರೂಪ "${v.pp}".`});
});
// 2. Perfect tense fill
VB.filter(v=>!v.reg&&v.p!==v.pp&&v.b!=="be").forEach(v=>{
  addQ({topic:"Tenses",diff:"Intermediate",q:`She has already ______ (${v.b}).`,a:v.pp,o:[v.p,v.ing,v.s].filter(x=>x!==v.pp),e:`Present perfect = has/have + V3. V3 of ${v.b} = ${v.pp}.`,ke:`has/have ನಂತರ V3 ರೂಪ ಬಳಸಬೇಕು: ${v.pp}.`});
  addQ({topic:"Common Errors",diff:"Advanced",q:`Find the correct sentence.`,a:`Did he ${v.b} yesterday?`,o:[`Did he ${v.p} yesterday?`,`Did he ${v.pp} yesterday?`,`Did he ${v.s} yesterday?`].filter(x=>x!==`Did he ${v.b} yesterday?`),e:`After 'did' always use the base form (V1): did + ${v.b}.`,ke:`did ನಂತರ ಯಾವಾಗಲೂ V1 (ಮೂಲ ರೂಪ).`});

function build(){const s=$("#bS").value,v=VB.find(x=>x.b===$("#bV").value),t=$("#bT").value;const sg=["He","She","It"].includes(s);const be=s==="I"?"am":sg?"is":"are",was=(s==="I"||sg)?"was":"were",has=sg?"has":"have",does=sg?"does":"do";const pp=v.pp.split("/")[0],p=v.p.split("/")[0];
 const rows=[["Present Simple",[s,sg?v.s:v.b],[s,does+" not",v.b],[does,s,v.b]],["Present Continuous",[s,be,v.ing],[s,be+" not",v.ing],[be,s,v.ing]],["Present Perfect",[s,has,pp],[s,has+" not",pp],[has,s,pp]],["Present Perfect Continuous",[s,has,"been",v.ing],[s,has+" not been",v.ing],[has,s,"been "+v.ing]],["Past Simple",[s,p],[s,"did not",v.b],["did",s,v.b]],["Past Continuous",[s,was,v.ing],[s,was+" not",v.ing],[was,s,v.ing]],["Past Perfect",[s,"had",pp],[s,"had not",pp],["had",s,pp]],["Past Perfect Continuous",[s,"had been",v.ing],[s,"had not been",v.ing],["had",s,"been "+v.ing]],["Future Simple",[s,"will",v.b],[s,"will not",v.b],["will",s,v.b]],["Future Continuous",[s,"will be",v.ing],[s,"will not be",v.ing],["will",s,"be "+v.ing]],["Future Perfect",[s,"will have",pp],[s,"will not have",pp],["will",s,"have "+pp]],["Future Perfect Continuous",[s,"will have been",v.ing],[s,"will not have been",v.ing],["will",s,"have been "+v.ing]]];
 const idx={a:1,n:2,q:3}[t];
 $("#bOut").innerHTML=`<div class="tablewrap"><table><tr><th>Tense</th><th>Sentence</th><th></th></tr>${rows.map(r=>{let x=r[idx].join(" ");x=x.charAt(0).toUpperCase()+x.slice(1);if(t==="q")x=x.replace(/\bI\b/,"I")+" ?";else x+=".";x=x.replace(" ?","?");return `<tr><td>${r[0]}</td><td><b>${x}</b></td><td>${sayBtn(x)}</td></tr>`}).join("")}</table></div><p class="muted kn">${v.b} = ${v.kn}</p>`}

let QZ=null;
function prepQ(q){const opts=shuffle([q.a,...q.o.slice(0,3)]);return Object.assign({},q,{opts})}
function startQuiz({title,pool,n,mode,timer}){
  if(!pool.length){toast("No questions available");return}
  const qs=shuffle(pool).slice(0,n).map(prepQ);
  QZ={title,qs,i:0,score:0,mode,ans:[],start:Date.now(),timer:timer||0};
  route="quizrun";renderQ();
}
let tmr;
function renderQ(){
  clearInterval(tmr);const z=QZ,q=z.qs[z.i];
  app(`<div class="row noprint" style="justify-content:space-between"><button class="btn alt sm" onclick="if(confirm('Leave this test?'))go('home')">✕ ${T("Exit","ನಿರ್ಗಮಿಸಿ")}</button><b>${esc(z.title)}</b><span id="tm" class="tag"></span></div>
  <div class="progress" style="margin:12px 0" aria-label="progress"><i style="width:${z.i/z.qs.length*100}%"></i></div>
  <div class="q"><span class="tag">${z.i+1}/${z.qs.length}</span><span class="tag">${q.topic}</span><span class="tag">${q.diff}</span>
  <div class="stem">${esc(q.q)}</div>
  <div role="group" aria-label="Options">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}" onclick="answer(${k})"><b>${"ABCD"[k]}.</b> ${esc(o)}</button>`).join("")}</div>
  <div id="fb"></div></div>`);
  if(z.timer){let left=z.timer-Math.floor((Date.now()-z.start)/1000);const tick=()=>{left=z.timer-Math.floor((Date.now()-z.start)/1000);const el=$("#tm");if(el)el.textContent="⏱ "+Math.max(0,Math.floor(left/60))+":"+String(Math.max(0,left%60)).padStart(2,"0");if(left<=0){clearInterval(tmr);finishQuiz()}};tick();tmr=setInterval(tick,1000)}
}
function record(q,ok){S.attempted++;if(ok)S.correct++;S.xp+=ok?5:1;const t=S.topicStats[q.topic]||{a:0,c:0};t.a++;if(ok)t.c++;S.topicStats[q.topic]=t;if(!ok&&!S.mistakes.find(m=>m.id===q.id))S.mistakes.push({id:q.id,date:today()});if(ok){const m=S.mistakes.find(m=>m.id===q.id);if(m)m.fixed=(m.fixed||0)+1}touchStreak();save()}
function answer(k){
  const z=QZ,q=z.qs[z.i];if(z.ans[z.i]!==undefined)return;const ok=q.opts[k]===q.a;z.ans[z.i]=k;if(ok)z.score++;record(q,ok);
  const exam=z.mode==="test";
  if(exam){next();return}
  document.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;if(q.opts[j]===q.a)b.classList.add("ok");else if(j===k)b.classList.add("bad")});
  $("#fb").innerHTML=`<div class="expl" role="status"><b>${ok?"✓ "+T("Correct!","ಸರಿ!"):"✗ "+T("Not quite.","ತಪ್ಪು.")}</b> ${T("Answer","ಉತ್ತರ")}: <b>${esc(q.a)}</b><br>${esc(q.e)}<br><span class="kn muted">${esc(q.ke)}</span></div><div class="row" style="margin-top:10px">${sayBtn(q.a)}<button class="btn" onclick="next()">${z.i+1<z.qs.length?T("Next →","ಮುಂದೆ →"):T("Finish","ಮುಗಿಸಿ")}</button></div>`;
}
function next(){QZ.i++;if(QZ.i>=QZ.qs.length)finishQuiz();else renderQ()}
function finishQuiz(){
  clearInterval(tmr);const z=QZ,pct=Math.round(z.score/z.qs.length*100);
  if(pct>S.best&&z.qs.length>=10)S.best=pct;S.history.unshift({d:today(),t:z.title,s:z.score,n:z.qs.length});S.history=S.history.slice(0,30);
  if(z.mode==="daily")S.daily[today()]=pct;save();
  const secs=Math.round((Date.now()-z.start)/1000);
  app(`<div class="card" style="text-align:center"><h1>${pct>=80?"🏆":pct>=50?"👍":"📚"} ${pct}%</h1><p>${z.score} / ${z.qs.length} ${T("correct","ಸರಿ")} • ${Math.floor(secs/60)}m ${secs%60}s</p><p class="muted">${pct>=80?T("Excellent! You are mastering verbs.","ಅತ್ಯುತ್ತಮ!"):pct>=50?T("Good work. Review the explanations below.","ಒಳ್ಳೆಯ ಪ್ರಯತ್ನ."):T("Keep practising – revise the lessons and try again.","ಮತ್ತೆ ಅಭ್ಯಾಸ ಮಾಡಿ.")}</p><div class="row" style="justify-content:center"><button class="btn" onclick="go('home')">${T("Home","ಮುಖಪುಟ")}</button><button class="btn alt" onclick="window.print()">🖨️ ${T("Print result","ಮುದ್ರಿಸಿ")}</button></div></div>
  <h2 style="margin-top:18px">${T("Answer review","ಉತ್ತರ ಪರಿಶೀಲನೆ")}</h2>${z.qs.map((q,i)=>{const a=z.ans[i];const ok=a!==undefined&&q.opts[a]===q.a;return `<div class="q" style="margin-bottom:10px"><span class="tag">${ok?"✓":"✗"} ${i+1}</span><div class="stem" style="font-size:1rem">${esc(q.q)}</div><p>${T("Your answer","ನಿಮ್ಮ ಉತ್ತರ")}: ${a===undefined?"—":esc(q.opts[a])}<br><b>${T("Correct","ಸರಿ")}: ${esc(q.a)}</b></p><div class="expl">${esc(q.e)}<br><span class="kn muted">${esc(q.ke)}</span></div></div>`}).join("")}`);
}

V.practice=()=>app(`${back()}<h1>${T("Practice","ಅಭ್ಯಾಸ")}</h1><p class="muted">${T("Instant feedback with explanations after every question.","ಪ್ರತಿ ಪ್ರಶ್ನೆಯ ನಂತರ ವಿವರಣೆ.")}</p><h3>${T("By level","ಮಟ್ಟದ ಪ್ರಕಾರ")}</h3><div class="row">${DIFFS.map(d=>`<button class="btn alt" onclick="startQuiz({title:'${d} Practice',pool:Q.filter(q=>q.diff==='${d}'),n:10,mode:'practice'})">${d} <span class="tag">${Q.filter(q=>q.diff===d).length}</span></button>`).join("")}</div><h3 style="margin-top:16px">${T("By topic","ವಿಷಯದ ಪ್ರಕಾರ")}</h3><div class="grid">${TOPICS.map(t=>{const s=S.topicStats[t];return `<button class="tile" onclick="startQuiz({title:'${t}',pool:Q.filter(q=>q.topic==='${t}'),n:10,mode:'practice'})"><b>${t}</b><small>${Q.filter(q=>q.topic===t).length} Qs ${s?`• ${Math.round(s.c/s.a*100)}%`:""}</small></button>`}).join("")}</div>`);
V.quiz=()=>app(`${back()}<h1>${T("Quiz","ರಸಪ್ರಶ್ನೆ")}</h1><div class="grid">${[["Quick Quiz",10,0,"practice","Random 10, instant feedback"],["Timed Quiz",20,600,"test","20 Qs • 10 minutes"],["Mixed Challenge",30,0,"practice","30 mixed questions"],["Speed Round",15,180,"test","15 Qs • 3 minutes"]].map(([t,n,tm,m,d])=>`<button class="tile" onclick="startQuiz({title:'${t}',pool:Q,n:${n},mode:'${m}',timer:${tm}})"><b>${t}</b><small>${d}</small></button>`).join("")}</div>`);
V.exam=()=>app(`${back()}<h1>${T("Competitive Exam Zone","ಸ್ಪರ್ಧಾತ್ಮಕ ಪರೀಕ್ಷಾ ವಲಯ")}</h1><p class="muted">${T("For KPSC, SSC, Banking, Railways, FDA/SDA, TET, CET and other exams.","KPSC, SSC, ಬ್ಯಾಂಕ್, ರೈಲ್ವೆ, FDA/SDA, TET ಪರೀಕ್ಷೆಗಳಿಗೆ.")}</p><div class="grid">${[["Error Spotting","Common Errors"],["Subject-Verb Agreement","Subject-Verb Agreement"],["Voice","Active & Passive Voice"],["Narration","Reported Speech"],["Conditionals & Subjunctive","Conditionals|Special Structures"],["Tenses","Tenses"],["Phrasal Verbs","Phrasal Verbs"],["Confusing Pairs","Confusing Pairs"]].map(([t,tp])=>`<button class="tile" onclick="startQuiz({title:'${t}',pool:Q.filter(q=>'${tp}'.split('|').includes(q.topic)&&q.diff!=='Beginner'),n:15,mode:'practice'})"><b>${t}</b><small>15 Qs</small></button>`).join("")}</div><div style="margin-top:14px"><button class="btn acc" onclick="startQuiz({title:'Competitive Mock Test',pool:Q.filter(q=>q.diff==='Competitive'||q.diff==='Advanced'),n:25,mode:'test',timer:900})">🏆 ${T("Mock Test – 25 Qs / 15 min","ಮಾದರಿ ಪರೀಕ್ಷೆ")}</button></div>`);
V.grand=()=>app(`${back()}<h1>${T("Grand Verb Test","ಮಹಾ ಕ್ರಿಯಾಪದ ಪರೀಕ್ಷೆ")}</h1><div class="card"><p>${T("50 questions from all topics and levels • 30 minutes • Answers shown at the end.","50 ಪ್ರಶ್ನೆಗಳು • 30 ನಿಮಿಷ • ಕೊನೆಯಲ್ಲಿ ಉತ್ತರಗಳು.")}</p><button class="btn acc" onclick="grand()">${T("Start Grand Test","ಆರಂಭಿಸಿ")}</button></div>`);
function grand(){const pool=[];DIFFS.forEach(d=>pool.push(...shuffle(Q.filter(q=>q.diff===d)).slice(0,d==="Beginner"?10:d==="Competitive"?12:14)));startQuiz({title:"Grand Verb Test",pool,n:50,mode:"test",timer:1800})}
V.daily=()=>{const d=today();let seed=[...d].reduce((a,c)=>a*31+c.charCodeAt(0)>>>0,7);const rnd=()=>(seed=(seed*1103515245+12345)>>>0)/4294967296;const pool=Q.slice().sort(()=>rnd()-.5).slice(0,10);startQuiz({title:"Daily Verb Challenge "+d,pool,n:10,mode:"daily"})};
V.revision=()=>{const w=weak();const ids=new Set(S.mistakes.map(m=>m.id));const pool=Q.filter(q=>ids.has(q.id)||w.includes(q.topic));app(`${back()}<h1>${T("Smart Revision","ಸ್ಮಾರ್ಟ್ ಪುನರಾವರ್ತನೆ")}</h1><div class="card"><p>${T("Revision focuses on your mistakes and weak topics.","ನಿಮ್ಮ ತಪ್ಪುಗಳು ಮತ್ತು ದುರ್ಬಲ ವಿಷಯಗಳ ಮೇಲೆ ಗಮನ.")}</p><p><b>${T("Weak topics","ದುರ್ಬಲ ವಿಷಯಗಳು")}:</b> ${w.join(", ")||T("None yet – keep practising!","ಇನ್ನೂ ಇಲ್ಲ")}</p><button class="btn" ${pool.length?"":"disabled"} onclick="startQuiz({title:'Smart Revision',pool:Q.filter(q=>${JSON.stringify([...ids])}.includes(q.id)||${JSON.stringify(w)}.includes(q.topic)),n:15,mode:'practice'})">${T("Start revision","ಆರಂಭಿಸಿ")} (${pool.length})</button></div><h2 style="margin-top:16px">${T("Quick revision sheet","ತ್ವರಿತ ಪುನರಾವರ್ತನೆ")}</h2><button class="btn alt sm noprint" onclick="window.print()">🖨️ Print</button><div class="card" style="margin-top:8px"><ul class="ex">${L.map(l=>`<li><b>${l.t}:</b> ${l.d}</li>`).join("")}</ul></div>`)};
V.mistakes=()=>{const items=S.mistakes.map(m=>({m,q:Q.find(q=>q.id===m.id)})).filter(x=>x.q);app(`${back()}<h1>${T("Mistake Book","ತಪ್ಪುಗಳ ಪುಸ್ತಕ")}</h1>${items.length?`<div class="row noprint" style="margin-bottom:10px"><button class="btn" onclick="startQuiz({title:'Mistake Retry',pool:Q.filter(q=>S.mistakes.some(m=>m.id===q.id)),n:20,mode:'practice'})">${T("Retry my mistakes","ತಪ್ಪುಗಳನ್ನು ಮರುಪ್ರಯತ್ನಿಸಿ")}</button><button class="btn alt" onclick="S.mistakes=S.mistakes.filter(m=>!(m.fixed>=1));save();go('mistakes')">${T("Clear corrected","ಸರಿಪಡಿಸಿದವನ್ನು ತೆಗೆ")}</button></div>`+items.map(({m,q})=>`<div class="q" style="margin-bottom:10px"><span class="tag">${q.topic}</span><span class="tag">${m.date}</span>${m.fixed?`<span class="tag">✓ ${T("corrected","ಸರಿಪಡಿಸಲಾಗಿದೆ")}</span>`:""}<div class="stem" style="font-size:1rem">${esc(q.q)}</div><b>${esc(q.a)}</b><div class="expl">${esc(q.e)}<br><span class="kn muted">${esc(q.ke)}</span></div></div>`).join(""):`<div class="card">${T("No mistakes saved yet. Wrong answers appear here automatically.","ಇನ್ನೂ ತಪ್ಪುಗಳಿಲ್ಲ.")}</div>`}`)};
V.bookmarks=()=>{const ls=L.filter(l=>S.bookmarks.includes(l.id));app(`${back()}<h1>${T("Bookmarks","ಬುಕ್‌ಮಾರ್ಕ್")}</h1>${ls.length?ls.map(l=>lessonHTML(l,true)).join(""):`<div class="card">${T("Tap 📑 on any lesson to save it here.","ಪಾಠದಲ್ಲಿ 📑 ಒತ್ತಿ.")}</div>`}`)};
V.roadmap=()=>app(`${back()}<h1>${T("Learning Roadmap","ಕಲಿಕಾ ಮಾರ್ಗ")}</h1><div class="progress" style="margin-bottom:12px"><i style="width:${S.done.length/L.length*100}%"></i></div>${L.map((l,i)=>`<div class="card" style="margin-bottom:8px;display:flex;gap:10px;align-items:center;cursor:pointer" tabindex="0" onclick="go('lesson','${l.id}')"><b style="font-family:var(--serif);font-size:1.3rem;width:32px">${i+1}</b><span style="flex:1">${T(l.t,l.kt)}</span>${S.done.includes(l.id)?"✅":"⬜"}</div>`).join("")}<div class="card"><b>26.</b> ${T("Competitive Practice → Grand Test","ಸ್ಪರ್ಧಾತ್ಮಕ ಅಭ್ಯಾಸ → ಮಹಾ ಪರೀಕ್ಷೆ")} <button class="btn sm" onclick="go('grand')">Go</button></div>`);
V.lesson=id=>app(`<button class="btn alt sm noprint" onclick="go('roadmap')">← ${T("Roadmap","ಮಾರ್ಗ")}</button><div style="margin-top:10px">${lessonHTML(L.find(l=>l.id===id),true)}</div>`);

V.flash=()=>{let deck=shuffle(VB.filter(v=>v.b!=="be")),i=0;const draw=()=>{const v=deck[i];app(`${back()}<h1>${T("Verb Flashcards","ಫ್ಲ್ಯಾಶ್‌ಕಾರ್ಡ್")}</h1><p class="muted">${T("Tap the card to flip.","ತಿರುಗಿಸಲು ಒತ್ತಿ.")} ${i+1}/${deck.length}</p><div class="flash" id="fc" tabindex="0" role="button" aria-label="Flip card" onclick="this.classList.toggle('flip')"><div class="in"><div class="face"><small class="muted">V1</small><b>${v.b}</b><span class="kn muted">${v.kn}</span></div><div class="face back"><small>V2 • V3 • V4</small><b style="font-size:1.4rem">${v.p} • ${v.pp}</b><span>${v.ing} • ${v.s}</span><small>${v.reg?"Regular":"Irregular"}</small></div></div></div><div class="row" style="justify-content:center"><button class="btn alt" id="fp">← Prev</button>${sayBtn(v.b+", "+v.p+", "+v.pp)}<button class="btn" id="fn">Next →</button></div>`);$("#fp").onclick=()=>{i=(i-1+deck.length)%deck.length;draw()};$("#fn").onclick=()=>{i=(i+1)%deck.length;draw()};$("#fc").onkeydown=e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();$("#fc").classList.toggle("flip")}}};draw()};

function paper(title,pool,n,showLevel){const qs=shuffle(pool).slice(0,n).map(prepQ);app(`<div class="row noprint">${back()}<button class="btn" onclick="window.print()">🖨️ ${T("Print","ಮುದ್ರಿಸಿ")}</button><button class="btn alt" onclick="document.getElementById('key').hidden=!document.getElementById('key').hidden">${T("Show/Hide answer key","ಉತ್ತರ ಸೂಚಿ")}</button></div><div class="card ws" style="margin-top:12px"><h2 style="text-align:center">KS LEARNING CENTER</h2><h3 style="text-align:center">${esc(title)}</h3><p>Name: ____________________ &nbsp; Date: __________ &nbsp; Marks: ____ / ${n}</p><ol>${qs.map(q=>`<li>${esc(q.q)}<br>${q.opts.map((o,k)=>`(${"abcd"[k]}) ${esc(o)}`).join(" &nbsp; ")}</li>`).join("")}</ol></div><div class="card" id="key" hidden style="margin-top:12px"><h3>Answer Key</h3><ol>${qs.map(q=>`<li><b>(${"abcd"[q.opts.indexOf(q.a)]}) ${esc(q.a)}</b> – ${esc(q.e)}</li>`).join("")}</ol></div>`)}
V.worksheet=()=>app(`${back()}<h1>${T("Worksheet Generator","ವರ್ಕ್‌ಶೀಟ್ ತಯಾರಕ")}</h1><div class="card"><div class="row"><select class="txt" id="wT" aria-label="Topic"><option value="">All topics</option>${TOPICS.map(t=>`<option>${t}</option>`).join("")}</select><select class="txt" id="wD" aria-label="Level"><option value="">All levels</option>${DIFFS.map(d=>`<option>${d}</option>`).join("")}</select><select class="txt" id="wN" aria-label="Number of questions"><option>10</option><option selected>20</option><option>30</option></select><button class="btn" onclick="const t=wT.value,d=wD.value;paper('Verb Worksheet'+(t?' – '+t:'')+(d?' ('+d+')':''),Q.filter(q=>(!t||q.topic===t)&&(!d||q.diff===d)),+wN.value)">${T("Generate","ತಯಾರಿಸಿ")}</button></div><p class="muted">${T("Each click creates a new randomised worksheet with an answer key.","ಪ್ರತಿ ಬಾರಿ ಹೊಸ ವರ್ಕ್‌ಶೀಟ್.")}</p></div>`);
V.papers=()=>app(`${back()}<h1>${T("Practice Papers","ಅಭ್ಯಾಸ ಪತ್ರಿಕೆ")}</h1><div class="grid">${[["Class 6–8 Paper","Beginner",25],["Class 9–10 Paper","Intermediate",30],["PU / Degree Paper","Advanced",30],["Competitive Exam Paper","Competitive",40]].map(([t,d,n])=>`<button class="tile" onclick="paper('${t}',Q.filter(q=>q.diff==='${d}'||(${n}>30&&q.diff==='Advanced')),${n})"><b>${t}</b><small>${n} Qs • ${d}</small></button>`).join("")}</div>`);

V.progress=()=>{const badges=[["First Step","Answer 1 question",S.attempted>=1],["Verb Explorer","Complete 5 lessons",S.done.length>=5],["Century","Attempt 100 questions",S.attempted>=100],["Sharp Shooter","80% accuracy (50+ Qs)",S.attempted>=50&&acc()>=80],["On Fire","7-day streak",S.streak>=7],["Grand Master","Score 90%+ in a test",S.best>=90],["Scholar","Complete all lessons",S.done.length>=L.length]];
 app(`${back()}<h1>${T("My Progress","ನನ್ನ ಪ್ರಗತಿ")}</h1><div class="stats"><div class="stat"><b>${S.attempted}</b><span>${T("Attempted","ಪ್ರಯತ್ನ")}</span></div><div class="stat"><b>${acc()}%</b><span>${T("Accuracy","ನಿಖರತೆ")}</span></div><div class="stat"><b>${S.xp}</b><span>XP • Level ${1+Math.floor(S.xp/200)}</span></div><div class="stat"><b>🔥 ${S.streak}</b><span>${T("Streak","ಸರಣಿ")}</span></div></div>
 <h2>${T("Badges","ಬ್ಯಾಡ್ಜ್")}</h2><div>${badges.map(([n,d,ok])=>`<span class="badge ${ok?"":"lock"}" title="${d}">${ok?"🏅":"🔒"} ${n}</span>`).join("")}</div>
 <h2 style="margin-top:16px">${T("Topic performance","ವಿಷಯವಾರು ಸಾಧನೆ")}</h2><div class="card">${TOPICS.map(t=>{const s=S.topicStats[t];const p=s?Math.round(s.c/s.a*100):0;return `<div style="margin:8px 0"><div class="row" style="justify-content:space-between"><span>${t}</span><span class="muted">${s?`${s.c}/${s.a} • ${p}%`:"—"}</span></div><div class="progress"><i style="width:${p}%"></i></div></div>`}).join("")}</div>
 <h2 style="margin-top:16px">${T("Recent tests","ಇತ್ತೀಚಿನ ಪರೀಕ್ಷೆಗಳು")}</h2><div class="tablewrap"><table><tr><th>Date</th><th>Test</th><th>Score</th></tr>${S.history.map(h=>`<tr><td>${h.d}</td><td>${esc(h.t)}</td><td>${h.s}/${h.n}</td></tr>`).join("")||"<tr><td colspan=3>—</td></tr>"}</table></div>
 <div class="row noprint" style="margin-top:16px"><button class="btn alt" onclick="window.print()">🖨️ ${T("Print report","ವರದಿ ಮುದ್ರಿಸಿ")}</button><button class="btn danger" onclick="resetAll()">${T("RESET MY PROGRESS","ನನ್ನ ಪ್ರಗತಿ ಅಳಿಸಿ")}</button></div>`)};
function resetAll(){if(!confirm("This will delete your scores, streak, bookmarks, mistake book, completed lessons and practice history. Continue?"))return;if(!confirm("Are you absolutely sure?"))return;const keep={lang:S.lang,theme:S.theme};S=Object.assign(defState(),keep);save();toast("Progress reset");go("home")}

/* ================= SEARCH ================= */
function doSearch(s){s=s.trim().toLowerCase();if(!s){go(route==="search"?"home":route);return}route="search";
 const ls=L.filter(l=>(l.t+l.d+l.ex.join(" ")+l.kt).toLowerCase().includes(s));
 const vs=VB.filter(v=>[v.b,v.p,v.pp,v.ing,v.s].some(x=>x.toLowerCase().split("/").includes(s)||x.toLowerCase().startsWith(s))||v.kn.includes(s)).slice(0,20);
 app(`<h2>${T("Search results","ಹುಡುಕಾಟ ಫಲಿತಾಂಶ")}: “${esc(s)}”</h2>${vs.length?`<div class="tablewrap" style="margin-bottom:14px"><table><tr><th>V1</th><th>V2</th><th>V3</th><th>V4</th><th>ಕನ್ನಡ</th></tr>${vs.map(v=>`<tr><td><b>${v.b}</b></td><td>${v.p}</td><td>${v.pp}</td><td>${v.ing}</td><td class="kn">${v.kn}</td></tr>`).join("")}</table></div>`:""}${ls.map(l=>lessonHTML(l,false)).join("")}${!vs.length&&!ls.length?`<div class="card">${T("Nothing found.","ಏನೂ ಸಿಗಲಿಲ್ಲ.")}</div>`:""}`)}

document.addEventListener("keydown",e=>{if(route==="quizrun"&&QZ&&["1","2","3","4"].includes(e.key)&&document.activeElement.tagName!=="INPUT"){const b=document.querySelector(`.opt[data-k="${+e.key-1}"]`);if(b&&!b.disabled)b.click()}});
document.querySelector(".brand").addEventListener("keydown",e=>{if(e.key==="Enter")go("home")});
applyChrome();go("home");
</script>
